[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voicewright"
version = "1.0.0"
description = "Local web app that designs custom voices and turns tagged Scripts into finished audio."
readme = "README.md"
# chatterbox-mlx requires >=3.11,<3.13 (docs/design.md, Environment).
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162",
    # Audio converter: ffmpeg through pydub (docs/design.md section 1). ffmpeg itself comes
    # from Homebrew. pydub needs audioop, which Python 3.13 removes; requires-python stops at 3.12.
    "pydub>=0.25.1",
    # FastAPI needs it to receive uploaded files.
    "python-multipart>=0.0.33",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
# The real speech model (Chatterbox on MLX, docs/design.md section 6). Apple Silicon only and
# several GB of weights, so it is optional: tests run on fake engines and never need it.
speech = [
    "chatterbox-mlx>=1.3.1",
]
# The real voice design model (Qwen3-TTS VoiceDesign on MLX, ADR 0003). Optional for the same
# reasons as speech.
voice-design = [
    "mlx-audio>=0.6.4",
]
dev = [
    "httpx2>=2.0",
    "pytest>=8",
    # Coverage reports: `pytest --cov=voicewright`.
    "pytest-cov>=6",
    # Browser E2E tests in tests/e2e (`pytest tests/e2e`); browsers come from
    # `playwright install chromium`.
    "pytest-playwright>=0.7",
    "ruff>=0.6",
]

[project.scripts]
voicewright = "voicewright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicewright = ["static/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The smoke tests load real models: run them by hand with `pytest -m smoke -s`.
addopts = "-m 'not smoke'"
# The browser E2E tests in tests/e2e run only when asked for: `pytest tests/e2e` (tests/conftest.py).
markers = [
    "smoke: loads a real model on the M2; slow, and run by hand",
    "e2e: drives the page in a real browser (Playwright) against the app on fakes",
]
filterwarnings = [
    # pydub imports audioop; harmless on the 3.11 and 3.12 this project supports.
    "ignore:'audioop' is deprecated:DeprecationWarning:pydub",
    # pytest-playwright's own base_url fixture, under pytest 9; nothing to change on our side.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Model spikes are one-off reference scripts, not app code.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
